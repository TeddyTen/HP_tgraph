<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav-inner">
      <a href="/" class="logo">
        <span class="logo-main">Tsumugi</span>
        <span class="logo-sub">Inc.</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/#services">事業内容</a></li>
        <li><a href="/blog/">ブログ</a></li>
        <li><a href="/app/">プロダクト</a></li>
        <li><a href="/about/">会社概要</a></li>
        <li><a href="/contact/" class="nav-cta">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-logo">
          <span class="logo-main">Tsumugi</span>
          <span class="logo-sub">Inc.</span>
          <p class="footer-address">株式会社Tsumugi<br>〒892-0847 鹿児島県鹿児島市西千石町11-21 鹿児島MSビル5F・6F</p>
        </div>
        <div class="footer-links">
          <a href="/#services">事業内容</a>
          <a href="/blog/">ブログ</a>
          <a href="/app/">プロダクト</a>
          <a href="/about/">会社概要</a>
          <a href="/contact/">お問い合わせ</a>
        </div>
      </div>
      <p class="footer-copy">&copy; 2025 Tsumugi Inc. All rights reserved.</p>
    </div>
  </footer>
  <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
</body>
</html>
